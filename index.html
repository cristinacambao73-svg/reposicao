<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Reposição</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        h2 {
            font-size: 16px;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #444;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        .info-fornecedor {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-add {
            background-color: #007bff;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .lista-box {
            border: 1px solid #ddd;
            border-radius: 6px;
            min-height: 100px;
            padding: 10px;
            background: #fafafa;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .item-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }
        .item-lista:last-child { border-bottom: none; }
        .btn-remove {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-whatsapp {
            display: block;
            background-color: #25D366;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Dados do Fornecedor</h2>
    <div class="info-fornecedor">Contacto: +351 919 658 512</div>

    <h2>Selecionar Mercadoria</h2>
    <label for="produto">Escolha o Produto:</label>
    <select id="produto">
        <option value="C1-0732 | Castelbel Lavender 250mL">C1-0732 | Castelbel Lavender 250mL</option>
        <option value="C1-0733 | Castelbel Lavender 900mL">C1-0733 | Castelbel Lavender 900mL</option>
        <option value="C1-1532 | Castelbel White Jasmine 250mL">C1-1532 | Castelbel White Jasmine 250mL</option>
        <option value="C1-1533 | Castelbel White Jasmine 900mL">C1-1533 | Castelbel White Jasmine 900mL</option>
        <option value="C1-1932 | Castelbel Verbena 250mL">C1-1932 | Castelbel Verbena 250mL</option>
        <option value="C1-1933 | Castelbel Verbena 900mL">C1-1933 | Castelbel Verbena 900mL</option>
        <option value="C1-2232 | Castelbel Cotton Flower 250mL">C1-2232 | Castelbel Cotton Flower 250mL</option>
        <option value="C1-2233 | Castelbel Cotton Flower 900mL">C1-2233 | Castelbel Cotton Flower 900mL</option>
        <option value="C1-9145 | CB Tile Lavender & Chamomile 250mL">C1-9145 | CB Tile Lavender & Chamomile 250mL</option>
        <option value="C1-9146 | CB Tile Lavender & Chamomile 900mL">C1-9146 | CB Tile Lavender & Chamomile 900mL</option>
        <option value="C1-9147 | CB Tile Santal Tonka 250mL">C1-9147 | CB Tile Santal Tonka 250mL</option>
        <option value="C1-9148 | CB Tile Santal Tonka 900mL">C1-9148 | CB Tile Santal Tonka 900mL</option>
        <option value="C1-9149 | CB Tile Green Sencha 250mL">C1-9149 | CB Tile Green Sencha 250mL</option>
        <option value="C1-9150 | CB Tile Green Sencha 900mL">C1-9150 | CB Tile Green Sencha 900mL</option>
        <option value="C2-1432 | Portus Cale Butterflies 250mL">C2-1432 | Portus Cale Butterflies 250mL</option>
        <option value="C2-1732 | Portus Cale Black Edition New 250mL">C2-1732 | Portus Cale Black Edition New 250mL</option>
        <option value="C2-1733 | Portus Cale Black Edition New 900mL">C2-1733 | Portus Cale Black Edition New 900mL</option>
        <option value="C2-2032 | Portus Cale Ruby Red 250mL">C2-2032 | Portus Cale Ruby Red 250mL</option>
        <option value="C2-2033 | Portus Cale Ruby Red 900mL">C2-2033 | Portus Cale Ruby Red 900mL</option>
        <option value="C2-2832 | Portus Cale Rosé Blush 250mL">C2-2832 | Portus Cale Rosé Blush 250mL</option>
        <option value="C2-2833 | Portus Cale Rosé Blush 900mL">C2-2833 | Portus Cale Rosé Blush 900mL</option>
        <option value="C2-2932 | Portus Cale Hajjar Blanc 250mL">C2-2932 | Portus Cale Hajjar Blanc 250mL</option>
        <option value="C2-2933 | Portus Cale Hajjar Blanc 900mL">C2-2933 | Portus Cale Hajjar Blanc 900mL</option>
        <option value="C2-2732 | Portus Cale White Crane 250mL">C2-2732 | Portus Cale White Crane 250mL</option>
        <option value="C2-2733 | Portus Cale White Crane 900mL">C2-2733 | Portus Cale White Crane 900mL</option>
        <option value="C2-2332 | Portus Cale Gold&Blue 250mL">C2-2332 | Portus Cale Gold&Blue 250mL</option>
        <option value="C2-2333 | Portus Cale Gold&Blue 900mL">C2-2333 | Portus Cale Gold&Blue 900mL</option>
    </select>

    <label for="quantidade">Qtd. / Unidade:</label>
    <input type="text" id="quantidade" value="1 un">

    <button class="btn-add" onclick="adicionarProduto()">Adicionar à Lista</button>

    <h2>Lista de Reposição Atual</h2>
    <div id="listaProdutos" class="lista-box">Nenhum produto adicionado.</div>

    <a id="linkEnviar" class="btn-whatsapp" href="#" onclick="return executarEnvio(event);">✉ ENVIAR PEDIDO VIA WHATSAPP</a>
</div>

<script>
    const numeroFornecedor = "351919658512";
    let itensPedido = [];

    function adicionarProduto() {
        const produto = document.getElementById('produto').value;
        const qtd = document.getElementById('quantidade').value.trim();

        if (!qtd) {
            alert('Por favor, defina uma quantidade.');
            return;
        }

        itensPedido.push({ produto, qtd });
        atualizarLista();
        document.getElementById('quantidade').value = "1 un";
    }

    function removerProduto(index) {
        itensPedido.splice(index, 1);
        atualizarLista();
    }

    function atualizarLista() {
        const listaDiv = document.getElementById('listaProdutos');
        listaDiv.innerHTML = '';

        if (itensPedido.length === 0) {
            listaDiv.innerHTML = 'Nenhum produto adicionado.';
            return;
        }

        itensPedido.forEach((item, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item-lista';
            itemDiv.innerHTML = '<span><strong>' + item.produto + '</strong> (' + item.qtd + ')</span>' +
                                '<button class="btn-remove" onclick="removerProduto(' + index + ')">Remover</button>';
            listaDiv.appendChild(itemDiv);
        });
    }

    function executarEnvio(event) {
        if (itensPedido.length === 0) {
            alert('A sua lista está vazia! Adicione produtos primeiro.');
            event.preventDefault();
            return false;
        }

        let mensagem = "*Novo Pedido de Reposição*\n\nOlá, gostaria de solicitar a reposição dos seguintes produtos:\n\n";
        itensPedido.forEach(function(item) {
            mensagem += "• *" + item.produto + "* (" + item.qtd + ")\n";
        });
        mensagem += "\nFico a aguardar a confirmação do pedido. Obrigado!";
        
        const url = "whatsapp://send?phone=" + numeroFornecedor + "&text=" + encodeURIComponent(mensagem);
        document.getElementById('linkEnviar').href = url;
        return true;
    }
    
    atualizarLista();
</script>

</body>
</html>

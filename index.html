            border: none;
            width: 100%;

    </style>

<script>

    let meusProdutosEscolhidos = [];

    function adicionarNovoItem() {
        const produtoSelect = document.getElementById("campoProduto");
        const quantidadeInput = document.getElementById("campoQuantidade");
        const produto = produtoSelect.value;
        const quantidade = quantidadeInput.value.trim();

        if (quantidade === "") {
            alert("Por favor, introduza uma quantidade.");
            return;
        }

        meusProdutosEscolhidos.push({ produto, quantity: quantidade });
        atualizarVisualizacaoLista();
    }

    function atualizarVisualizacaoLista() {
        const quadroLista = document.getElementById("quadroLista");
        if (meusProdutosEscolhidos.length === 0) {
            quadroLista.innerHTML = "Nenhum produto adicionado.";
            return;
        }
        quadroLista.innerHTML = "";
        meusProdutosEscolhidos.forEach((item, index) => {
            const divItem = document.createElement("div");
            divItem.className = "item-lista";
            divItem.innerHTML = `
                <span><strong>${item.quantity}</strong> - ${item.produto}</span>
                <button class="btn-remove" onclick="removerItem(${index})">Remover</button>
            `;
            quadroLista.appendChild(divItem);
        });
    }

    function removerItem(index) {
        meusProdutosEscolhidos.splice(index, 1);
        atualizarVisualizacaoLista();
    }

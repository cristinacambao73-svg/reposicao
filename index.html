            overflow-y: auto;

            background: #fafafa;

        .item-lista {

            align-items: center;

        }
        .item-lista:last-child { border-bottom: none; }
        .btn-remove {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-whatsapp {

            background-color: #25D366;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 10px;

            cursor: pointer;
        }
        .btn-whatsapp:active { background-color: #1ebd59; }
        .btn-instalar {

            color: white;
            border: none;
            width: 100%;

    <label for="quantidade">Qtd. / Unidade:</label>
    <input type="text" id="quantidade" value="1 un">

    <button class="btn-add" onclick="adicionarProduto()">Adicionar à Lista</button>

    <div id="listaProdutos" class="lista-box">
        <!-- Itens dinâmicos -->
    </div>

    <a id="linkEnviar" class="btn-whatsapp" href="#" onclick="return executarEnvioNativo(event);">✉ ENVIAR PEDIDO VIA WHATSAPP</a>
</div>

<script>
    const numeroFornecedor = "351919658512";
    let itensPedido = [];

    function adicionarProduto() {
        const produto = document.getElementById('produto').value;
        const qtd = document.getElementById('quantidade').value.trim();

        if (!qtd) {
            alert('Por favor, defina uma quantidade.');
            return;
        }

        itensPedido.push({ produto, qtd });
        atualizarInterfaceLista();
        document.getElementById('quantidade').value = "1 un";
    }

    function removerProduto(index) {
        itensPedido.splice(index, 1);
        atualizarInterfaceLista();
    }

    function atualizarInterfaceLista() {
        const listaDiv = document.getElementById('listaProdutos');
        listaDiv.innerHTML = '';

        if (itensPedido.length === 0) {
            listaDiv.innerHTML = '<span style="color:#888; font-size:14px;">Nenhum produto adicionado.</span>';
            return;
        }

        itensPedido.forEach((item, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'item-lista';
            itemDiv.innerHTML = `
                <span><strong>${item.produto}</strong> (${item.qtd})</span>
                <button class="btn-remove" onclick="removerProduto(${index})">Remover</button>
            `;
            listaDiv.appendChild(itemDiv);
        });
    }

    function executarEnvioNativo(event) {
        if (itensPedido.length === 0) {
            alert('A sua lista está vazia! Adicione produtos primeiro.');
            event.preventDefault();
            return false;
        }

        let mensagem = "*Novo Pedido de Reposição*\n\n";
        mensagem += "Olá, gostaria de solicitar a reposição dos seguintes produtos:\n\n";

        itensPedido.forEach(item => {
            mensagem += `• *${item.produto}* (${item.qtd})\n`;
        });
